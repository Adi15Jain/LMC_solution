[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmc"
version = "0.1.0"
description = "Separating Large Magellanic Cloud members from Milky Way foreground in Gaia data"
requires-python = ">=3.12"

# Pinned to what the notebooks were actually executed against. The results in
# 01-06 are reproducible with these versions; loosen them and re-run before
# claiming otherwise.
dependencies = [
    "polars==1.42.1",
    "numpy==2.5.1",
    "scipy==1.18.0",
    "scikit-learn==1.9.0",
    "xgboost==3.3.0",
    "joblib==1.5.3",
    "matplotlib==3.11.1",
    "pyarrow==25.0.0",
]

[project.optional-dependencies]
# Only needed to regenerate the browser-side model for the web app's Act 6 probe.
web = [
    "onnx",
    "onnxmltools",
    "onnxruntime",
]
notebook = [
    "jupyter",
    "jupyterlab",
    "ipykernel",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
